name: Publicación programada de artículos

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel rebuild
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Deploy triggered (HTTP $response)"
          else
            echo "Deploy failed (HTTP $response)"
            exit 1
          fi
